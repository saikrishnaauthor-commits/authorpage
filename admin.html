<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Author Store — Admin Dashboard</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-800 min-h-screen">
<header class="bg-indigo-950 text-white p-5"><div class="max-w-7xl mx-auto flex justify-between items-center gap-3"><div><h1 class="text-xl font-bold">Sai Krishna Author Store</h1><p class="text-sm text-indigo-200">Admin order & delivery management</p></div><button id="logout" class="hidden bg-indigo-800 px-4 py-2 rounded-lg">Log out</button></div></header>
<main class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
<section id="login-panel" class="bg-white p-6 rounded-xl shadow max-w-md mx-auto mt-10"><h2 class="text-xl font-bold mb-2">Admin login</h2><p class="text-sm text-slate-600 mb-4">Enter the private ADMIN_TOKEN configured in Render.</p><form id="login-form" class="space-y-4"><input id="admin-token" type="password" required autocomplete="current-password" placeholder="Admin token" class="w-full border rounded-lg p-3"><button class="w-full bg-indigo-700 hover:bg-indigo-800 text-white rounded-lg p-3 font-semibold">View orders</button></form><p id="login-error" class="text-red-600 text-sm mt-3" role="alert"></p></section>
<section id="dashboard" class="hidden space-y-6"><div class="flex flex-col md:flex-row gap-3 md:justify-between md:items-center"><div><h2 class="text-2xl font-bold">Paid orders</h2><p class="text-sm text-slate-600">Update paperback fulfilment. Courier and tracking number are required when shipping.</p></div><button id="refresh" class="bg-indigo-700 text-white px-4 py-2 rounded-lg">Refresh orders</button></div>
<p id="status" class="text-sm" role="status"></p><div class="grid grid-cols-1 sm:grid-cols-3 gap-4"><div class="bg-white rounded-xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Paid orders</p><p id="order-count" class="text-3xl font-bold">0</p></div><div class="bg-white rounded-xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Total sales</p><p id="sales-total" class="text-3xl font-bold">₹0</p></div><div class="bg-white rounded-xl p-5 shadow-sm"><p class="text-slate-500 text-sm">Awaiting shipment</p><p id="pending-count" class="text-3xl font-bold">0</p></div></div>
<input id="search" type="search" placeholder="Search order number, email, book, payment ID or tracking number..." class="w-full bg-white border rounded-lg p-3">
<div id="orders-list" class="space-y-4"><div class="bg-white rounded-xl p-5">No orders loaded.</div></div></section></main>
<script>
const API_URL='https://authorpage-gybu.onrender.com';let adminToken='',orders=[];const $=id=>document.getElementById(id);const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR'}).format(Number(v)||0);const stages=['Order Received','Order Confirmed','Shipped','Delivered'];
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function showError(m){$('login-error').textContent=m;$('status').textContent=m;}
async function loadOrders(){ $('status').textContent='Loading orders…';$('refresh').disabled=true;try{const r=await fetch(`${API_URL}/api/orders`,{headers:{Authorization:`Bearer ${adminToken}`},cache:'no-store'});if(r.status===401)throw Error('Invalid admin token. Log in again.');if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||`Could not load orders (HTTP ${r.status}).`);}orders=await r.json();$('login-panel').classList.add('hidden');$('dashboard').classList.remove('hidden');$('logout').classList.remove('hidden');$('login-error').textContent='';renderOrders();$('status').textContent=`Loaded ${orders.length} paid order(s).`;}catch(e){showError(e.message);if(e.message.includes('Invalid admin token'))logout();}finally{$('refresh').disabled=false;}}
function isPaperback(o){return(o.items||[]).some(i=>String(i.type||i.id||'').toLowerCase().includes('paperback')||String(i.id||'').endsWith('_pb'));}
function renderOrders(){const q=$('search').value.trim().toLowerCase();const filtered=orders.filter(o=>[o.orderNumber,o.customerEmail,o.razorpayPaymentId,o.razorpayOrderId,o.trackingNumber,(o.items||[]).map(i=>`${i.name||''} ${i.id||''}`).join(' ')].join(' ').toLowerCase().includes(q));$('order-count').textContent=orders.length;$('sales-total').textContent=money(orders.reduce((s,o)=>s+(Number(o.amountTotal)||0),0));$('pending-count').textContent=orders.filter(o=>isPaperback(o)&&!['Delivered'].includes(o.fulfillmentStatus)).length;const list=$('orders-list');list.replaceChildren();if(!filtered.length){list.append(el('div','bg-white rounded-xl p-5','No matching paid orders found.'));return;}for(const o of filtered){const card=el('article','bg-white rounded-xl shadow-sm p-5 space-y-4');const top=el('div','flex flex-col md:flex-row md:justify-between gap-3');const heading=el('div');heading.append(el('h3','font-bold text-lg',o.orderNumber||'Order number unavailable'),el('p','text-sm text-slate-500',`${o.createdAt?new Date(o.createdAt).toLocaleString('en-IN'):'—'} · ${o.customerEmail||'No email'}`));const badge=el('span','inline-flex self-start rounded-full bg-indigo-50 text-indigo-800 px-3 py-1 text-sm font-semibold',isPaperback(o)?(o.fulfillmentStatus||'Order Received'):'Digital Delivery');top.append(heading,badge);card.append(top);
const items=el('div','border-t border-b py-3 space-y-1');for(const i of(o.items||[]))items.append(el('p','text-sm',`${i.name||i.id||'Book'} × ${i.quantity||1} — ${money((Number(i.price)||0)*(Number(i.quantity)||1))}`));card.append(items);
const meta=el('div','grid grid-cols-1 md:grid-cols-3 gap-3 text-sm');meta.append(el('div','break-all',`Total: ${money(o.amountTotal)}`),el('div','break-all',`Payment ID: ${o.razorpayPaymentId||'—'}`),el('div','break-all',`Courier: ${o.courierName||'—'} · Tracking: ${o.trackingNumber||'—'}`));card.append(meta);if(o.shippingAddress){const addr=typeof o.shippingAddress==='string'?o.shippingAddress:Object.entries(o.shippingAddress).filter(([k,v])=>v!==null&&v!==undefined&&String(v).trim()).map(([k,v])=>`${k}: ${v}`).join(' · ');if(addr)card.append(el('p','text-sm text-slate-600 break-words',`Shipping address: ${addr}`));}
if(isPaperback(o)){const form=el('div','rounded-xl bg-slate-50 p-4 space-y-3');form.append(el('h4','font-semibold','Update delivery status'));const grid=el('div','grid grid-cols-1 md:grid-cols-2 gap-3');const status=el('select','w-full border rounded-lg p-2');for(const stage of stages){const opt=el('option','',stage);opt.value=stage;status.append(opt);}status.value=o.fulfillmentStatus||'Order Received';const courier=el('input','w-full border rounded-lg p-2');courier.placeholder='Courier name (e.g. India Post)';courier.value=o.courierName||'';const tracking=el('input','w-full border rounded-lg p-2');tracking.placeholder='Tracking / AWB number';tracking.value=o.trackingNumber||'';const url=el('input','w-full border rounded-lg p-2');url.placeholder='Tracking URL (optional)';url.value=o.trackingUrl||'';grid.append(status,courier,tracking,url);form.append(grid);form.append(el('p','text-xs text-slate-500','Move one stage at a time. Courier and tracking number are mandatory for Shipped and Delivered.'));const save=el('button','bg-indigo-700 hover:bg-indigo-800 text-white px-4 py-2 rounded-lg font-semibold','Save delivery update');save.type='button';save.addEventListener('click',()=>updateFulfillment(o.orderNumber,{fulfillmentStatus:status.value,courierName:courier.value,trackingNumber:tracking.value,trackingUrl:url.value},save));form.append(save);card.append(form);}else{card.append(el('p','text-sm text-emerald-700 font-medium','Digital order — no physical shipping required.'));}
if(Array.isArray(o.fulfillmentHistory)&&o.fulfillmentHistory.length){const hist=el('div','text-sm text-slate-600');hist.append(el('p','font-semibold mb-1','Status history'));for(const h of o.fulfillmentHistory)hist.append(el('p','',`${h.status} · ${h.at?new Date(h.at).toLocaleString('en-IN'):'time unavailable'}${h.trackingNumber?' · '+h.trackingNumber:''}`));card.append(hist);}list.append(card);}}
async function updateFulfillment(orderNumber,payload,button){button.disabled=true;button.textContent='Saving…';try{const r=await fetch(`${API_URL}/api/orders/${encodeURIComponent(orderNumber)}/fulfillment`,{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:`Bearer ${adminToken}`},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`Update failed (HTTP ${r.status}).`);$('status').textContent=`${orderNumber}: ${payload.fulfillmentStatus} saved.`;await loadOrders();}catch(e){$('status').textContent=e.message;button.disabled=false;button.textContent='Save delivery update';}}
function logout(){adminToken='';orders=[];$('admin-token').value='';$('login-panel').classList.remove('hidden');$('dashboard').classList.add('hidden');$('logout').classList.add('hidden');$('login-error').textContent='';$('status').textContent='';$('orders-list').replaceChildren();}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();adminToken=$('admin-token').value.trim();if(adminToken)await loadOrders();});$('refresh').addEventListener('click',loadOrders);$('search').addEventListener('input',renderOrders);$('logout').addEventListener('click',logout);
</script></body></html>
