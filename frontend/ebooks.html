<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My E-books | Sai Krishna Author Store</title>
<script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
<header class="bg-white shadow-sm sticky top-0 z-40">
<div class="max-w-6xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
<a href="index.html" class="text-2xl font-bold text-indigo-700">Sai Krishna | Author</a>
<nav class="flex flex-wrap gap-4 font-medium text-gray-600">
<a href="index.html">Home</a>
<a href="books.html">Books</a>
<a href="about.html">About Author</a>
<a href="reviews.html">Reviews</a>
<a href="ebooks.html">My E-books</a>
<a href="order-status.html">Order Status</a>
</nav>
</div>
</header>
<section id="my-ebooks" class="py-16 px-4 bg-white">
  <div class="max-w-3xl mx-auto">
    <div class="text-center mb-8">
      <p class="text-sm font-semibold tracking-widest text-indigo-600">YOUR LIBRARY</p>
      <h2 class="text-3xl font-bold text-gray-900 mt-2">My E-books</h2>
      <p class="text-gray-600 mt-3">
        Enter your order ID and purchase email to access your purchased e-books.
      </p>
    </div>

    <div id="ebook-login-panel" class="max-w-xl mx-auto">
      <form id="ebook-email-form" class="space-y-5">
        <div>
          <label for="ebook-order-id" class="block text-sm font-medium text-gray-700 mb-2">
            Order ID
          </label>
          <input
            type="text"
            id="ebook-order-id"
            name="orderNumber"
            placeholder="Enter your order ID"
            required
            autocomplete="off"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none"
          />
        </div>

        <div>
          <label for="ebook-email" class="block text-sm font-medium text-gray-700 mb-2">
            Purchase email
          </label>
          <input
            type="email"
            id="ebook-email"
            name="email"
            placeholder="Enter the email used at checkout"
            required
            autocomplete="email"
            class="w-full border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-indigo-500 outline-none"
          />
        </div>

        <button
          type="submit"
          id="ebook-login-button"
          class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold rounded-lg px-4 py-3"
        >
          Access My E-books
        </button>

        <p id="ebook-login-message" class="text-sm" aria-live="polite"></p>
      </form>

    </div>

    <div id="ebook-library-panel" class="hidden mt-8">
      <div class="flex items-center justify-between gap-4 mb-5">
        <p class="text-sm text-gray-600">
          Signed in as <span id="ebook-signed-in-email"></span>
        </p>
        <button id="ebook-logout" type="button"
          class="text-indigo-700 font-medium hover:underline">
          Log out
        </button>
      </div>

      <div id="ebook-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
      <p id="ebook-empty" class="hidden text-gray-600 text-center py-6">
        No purchased e-books were found for this order.
      </p>
    </div>

    <div id="ebook-reader-panel" class="hidden mt-8">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h3 id="ebook-reader-title" class="text-xl font-bold"></h3>
        <button id="ebook-close-reader" type="button"
          class="text-indigo-700 font-medium hover:underline">
          Back to library
        </button>
      </div>

      <p id="ebook-reader-message" class="hidden text-red-600 mb-3"></p>

      <div class="overflow-auto border rounded-lg bg-gray-100 p-3 text-center">
        <canvas id="ebook-page-canvas" class="mx-auto max-w-full"></canvas>
      </div>

      <div class="flex flex-wrap items-center justify-center gap-3 mt-5">
        <button id="ebook-prev-page" type="button"
          class="border rounded-lg px-4 py-2">Previous</button>
        <span id="ebook-page-count" class="text-sm text-gray-600"></span>
        <button id="ebook-next-page" type="button"
          class="border rounded-lg px-4 py-2">Next</button>
        <button id="ebook-zoom-out" type="button"
          class="border rounded-lg px-3 py-2">-</button>
        <button id="ebook-zoom-in" type="button"
          class="border rounded-lg px-3 py-2">+</button>
      </div>
    </div>
  </div>
</section>
    
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/ebooks.js"></script>
</body>
</html>
