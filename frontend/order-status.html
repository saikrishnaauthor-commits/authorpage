<!-- Customer Order Status Lookup -->
    <section id="order-status" class="bg-indigo-50 border-y border-indigo-100 py-16 px-4">
      <div class="max-w-3xl mx-auto">
        <div class="text-center mb-8"><p class="text-xs uppercase tracking-widest font-semibold text-indigo-600">Order tracking</p><h2 class="text-3xl font-bold text-gray-900 mt-2">Check Your Order Status</h2><p class="text-gray-600 mt-2">Enter the order number from your confirmation and the email used at checkout.</p></div>
        <form id="order-lookup-form" class="bg-white rounded-2xl shadow-sm p-5 md:p-7 space-y-4">
          <div><label for="lookup-order-number" class="block text-sm font-semibold mb-1">Order number</label><input id="lookup-order-number" required autocomplete="off" placeholder="e.g. SKS-20261013-AB12CD34" class="w-full border rounded-lg p-3"></div>
          <div><label for="lookup-email" class="block text-sm font-semibold mb-1">Checkout email</label><input id="lookup-email" type="email" required autocomplete="email" placeholder="you@example.com" class="w-full border rounded-lg p-3"></div>
          <button id="lookup-submit" class="w-full bg-indigo-700 hover:bg-indigo-800 text-white font-semibold rounded-lg p-3">Find my order</button>
          <p id="lookup-message" class="text-sm" role="status" aria-live="polite"></p>
          <div id="lookup-result" class="hidden"></div>
        </form>
      </div>
    </section>





    
<script src="js/order-status.js"></script>
