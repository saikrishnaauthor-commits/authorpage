<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Details | Sai Krishna Author Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f8fafc}.cover{width:100%;max-width:360px;max-height:520px;object-fit:contain}.buy{display:inline-flex;align-items:center;border-radius:.65rem;padding:.75rem 1rem;font-weight:700}</style>
</head>
<body class="text-slate-800">
<header class="bg-white shadow-sm"><div class="max-w-5xl mx-auto p-4 flex justify-between gap-3"><a class="font-bold text-xl text-indigo-700" href="index.html">Sai Krishna | Author</a><a href="books.html" class="font-semibold text-indigo-700">← All books</a></div></header>
<main class="max-w-5xl mx-auto p-5 md:p-10"><p id="status" role="status" class="text-slate-600">Loading book details…</p><article id="book" class="hidden grid gap-8 md:grid-cols-2 bg-white p-5 md:p-8 rounded-2xl shadow-sm"><div class="flex justify-center items-start"><img id="cover" class="cover rounded-xl" alt="Book cover"></div><div><p class="text-xs uppercase tracking-widest font-bold text-indigo-600">Sai Krishna Author Store</p><h1 id="title" class="text-3xl font-bold mt-2"></h1><p id="description" class="mt-4 leading-7 whitespace-pre-line"></p><div class="mt-6 flex flex-wrap gap-3"><button id="paperback" class="buy bg-indigo-600 text-white">Paperback</button><button id="ebook" class="buy bg-slate-100 text-slate-800">E-book</button></div><section class="mt-8"><h2 class="text-lg font-bold">Buy from other stores</h2><p class="text-sm text-slate-500 mt-1">Choose a retailer below to open this book's product page.</p><div id="marketplaces" class="mt-3 flex flex-wrap gap-2"></div></section></div></article></main>
<script src="js/config.js"></script><script>
const API_URL = window.API_URL || 'https://authorpage-gybu.onrender.com';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const retailers=[['Amazon','amazonUrl','bg-amber-100 text-amber-900'],['Flipkart','flipkartUrl','bg-blue-100 text-blue-900'],['Pothi','pothiUrl','bg-emerald-100 text-emerald-900']];
function validRetailerUrl(label,url){try{const u=new URL(url);const host=u.hostname.toLowerCase();const allowed=label==='Amazon'?/(^|\\.)amazon\\.(in|com|co\\.uk|ca|com\\.au)$/.test(host):label==='Flipkart'?/(^|\\.)flipkart\\.com$/.test(host):label==='Pothi'?/(^|\\.)pothi\\.com$/.test(host):false;return u.protocol==='https:'&&allowed;}catch{return false;}}
async function init(){try{const r=await fetch(API_URL+'/api/catalog',{cache:'no-store'});if(!r.ok)throw Error('Could not load book catalogue.');const books=await r.json();const id=new URLSearchParams(location.search).get('id');const b=books.find(x=>[x.pbId,x.ebId,x.id].includes(id));if(!b)throw Error('Book not found.');document.title=b.title+' | Sai Krishna Author Store';document.getElementById('title').textContent=b.title;document.getElementById('description').textContent=b.desc||'';document.getElementById('cover').src=b.image||'';document.getElementById('cover').alt=b.title+' cover';document.getElementById('paperback').textContent='Paperback · ₹'+(Number(b.pbPrice)||0);document.getElementById('ebook').textContent='E-book · ₹'+(Number(b.ebPrice)||0);document.getElementById('paperback').onclick=()=>location.href='books.html';document.getElementById('ebook').onclick=()=>location.href='ebooks.html';const box=document.getElementById('marketplaces');let count=0;for(const [label,key,cls] of retailers){const url=b[key];if(validRetailerUrl(label,url)){const a=document.createElement('a');a.className='buy '+cls;a.href=url;a.target='_blank';a.rel='noopener noreferrer';a.textContent='Buy on '+label+' ↗';box.append(a);count++;}}if(!count)box.innerHTML='<p class="text-sm text-slate-500">External purchase links will appear here when configured by the administrator.</p>';document.getElementById('book').classList.remove('hidden');document.getElementById('status').remove();}catch(e){document.getElementById('status').textContent=e.message;}}
init();
</script></body></html>
