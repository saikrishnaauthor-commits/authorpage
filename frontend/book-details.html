<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Details | Sai Krishna Author Store</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
    <div class="site-header__inner">
        <a href="index.html" class="site-brand" aria-label="Sai Krishna, Author — home">
            <span class="site-brand__mark" aria-hidden="true">SK</span>
            <span class="site-brand__text">Sai Krishna<small>Author</small></span>
        </a>
        <button type="button" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">☰</button>
        <nav id="site-nav" class="site-nav" aria-label="Main">
            <a href="index.html">Home</a>
            <a href="books.html">Books</a>
            <a href="about.html">About</a>
            <a href="reviews.html">Reviews</a>
            <a href="ebooks.html">My E-books</a>
            <a href="order-status.html">Order Status</a>
        </nav>
    </div>
</header>

<main>
    <section class="page-hero">
        <div class="page-hero__inner !pb-28 !pt-8">
            <nav aria-label="Breadcrumb" class="text-sm text-[#b9c2d4]">
                <a href="books.html" class="hover:text-white">Books</a>
                <span class="mx-2" aria-hidden="true">/</span>
                <span id="crumb" aria-current="page">Book details</span>
            </nav>
        </div>
    </section>

    <div class="mx-auto max-w-[1100px] px-5 pb-20">
        <p id="status" role="status" class="form-card page-overlap -mt-20 text-center text-slate-600">Loading book details…</p>

        <article id="book" class="form-card hidden -mt-20 relative grid gap-10 md:grid-cols-[minmax(0,380px)_1fr] md:p-10">
            <div class="grid place-items-center self-start rounded-2xl bg-[radial-gradient(ellipse_at_top,#33476b,#101b35_72%)] p-8">
                <img id="cover" class="max-h-[460px] w-full object-contain drop-shadow-2xl" alt="Book cover">
            </div>
            <div class="min-w-0">
                <p id="series" class="eyebrow">Sai Krishna Seelaboyina</p>
                <h1 id="title" class="mt-3 text-3xl font-semibold leading-tight text-[#101b35] sm:text-4xl"></h1>

                <div id="formats" class="mt-6 flex flex-wrap gap-3"></div>

                <p id="description" class="mt-6 whitespace-pre-line text-[17px] leading-8 text-slate-600"></p>

                <div class="mt-8 flex flex-wrap gap-3">
                    <a href="books.html" class="btn btn-navy">Buy from the author →</a>
                </div>

                <section class="mt-10 border-t border-[#efeae0] pt-6">
                    <h2 class="text-lg font-semibold text-[#101b35]">Also available from</h2>
                    <div id="marketplaces" class="mt-3 flex flex-wrap gap-2"></div>
                </section>
            </div>
        </article>

        <section id="book-reviews" class="mt-16 hidden" aria-labelledby="book-reviews-title">
            <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-end">
                <div>
                    <p class="eyebrow">Reader reviews</p>
                    <h2 id="book-reviews-title" class="section-title mt-3">What readers think</h2>
                    <p id="book-reviews-summary" class="mt-2 text-sm font-semibold text-slate-600"></p>
                </div>
                <a id="book-review-link" href="reviews.html#write-review" class="btn btn-outline">Write a review</a>
            </div>
            <div id="book-reviews-list" class="mt-8 grid gap-6 md:grid-cols-2"></div>
            <p id="book-reviews-empty" class="surface-card mt-8 hidden p-6 text-slate-600">No reviews yet — be the first to share what you thought.</p>
        </section>
    </div>
</main>

<div id="site-footer"></div>
<script src="js/config.js"></script>
<script>
const retailers = [
  ['Amazon', 'amazonUrl', 'bg-amber-100 text-amber-900 hover:bg-amber-200'],
  ['Flipkart', 'flipkartUrl', 'bg-blue-100 text-blue-900 hover:bg-blue-200'],
  ['Pothi', 'pothiUrl', 'bg-emerald-100 text-emerald-900 hover:bg-emerald-200']
];

function validRetailerUrl(label, url) {
  try {
    const parsed = new URL(url);
    if (parsed.protocol !== 'https:') return false;
    const host = parsed.hostname.toLowerCase();
    const allowedHosts = {
      Amazon: ['amazon.in', 'amazon.com', 'amazon.co.uk', 'amazon.ca', 'amazon.com.au'],
      Flipkart: ['flipkart.com'],
      Pothi: ['pothi.com']
    };
    return (allowedHosts[label] || []).some(domain => host === domain || host.endsWith('.' + domain));
  } catch {
    return false;
  }
}

async function loadCatalog() {
  try {
    const r = await fetch(API_URL + '/api/catalog', { cache: 'no-store' });
    if (!r.ok) throw Error();
    const data = await r.json();
    if (Array.isArray(data)) return data;
  } catch {}
  const r = await fetch('catalog.json', { cache: 'no-store' });
  if (!r.ok) throw Error('Could not load the book catalogue. Please refresh the page.');
  return r.json();
}

function formatChip(label, price) {
  const chip = document.createElement('div');
  chip.className = 'rounded-xl border border-[#ebe6db] bg-[#fbfaf7] px-4 py-2';
  const name = document.createElement('p');
  name.className = 'text-xs font-semibold uppercase tracking-wider text-slate-500';
  name.textContent = label;
  const value = document.createElement('p');
  value.className = 'font-display text-xl font-semibold text-[#101b35]';
  value.textContent = '₹' + (Number(price) || 0);
  chip.append(name, value);
  return chip;
}

async function init() {
  const status = document.getElementById('status');
  try {
    const books = await loadCatalog();
    const id = new URLSearchParams(location.search).get('id');
    const b = books.find(x => [x.pbId, x.ebId, x.id].includes(id));
    if (!b) throw Error('We couldn’t find that book. It may have been removed from the catalogue.');

    document.title = b.title + ' | Sai Krishna Author Store';
    document.getElementById('crumb').textContent = b.title;
    document.getElementById('title').textContent = b.title;
    if (b.series) document.getElementById('series').textContent = b.series;
    document.getElementById('description').textContent = b.desc || '';
    const cover = document.getElementById('cover');
    cover.src = b.image || '';
    cover.alt = b.title + ' cover';

    const formats = document.getElementById('formats');
    if (b.sellPaperback !== false) formats.append(formatChip('Paperback', b.pbPrice));
    if (b.sellEbook !== false) formats.append(formatChip('E-book', b.ebPrice));

    const box = document.getElementById('marketplaces');
    for (const [label, key, cls] of retailers) {
      const url = b[key];
      if (!validRetailerUrl(label, url)) continue;
      const a = document.createElement('a');
      a.className = 'rounded-lg px-4 py-2.5 text-sm font-semibold transition ' + cls;
      a.href = url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = 'Buy on ' + label + ' ↗';
      box.append(a);
    }
    if (!box.children.length) box.closest('section').remove();

    document.getElementById('book').classList.remove('hidden');
    status.remove();
    loadBookReviews(b);
  } catch (e) {
    status.textContent = '';
    const msg = document.createElement('p');
    msg.textContent = e.message;
    const back = document.createElement('a');
    back.href = 'books.html';
    back.className = 'btn btn-navy mt-5';
    back.textContent = 'Browse all books';
    status.append(msg, back);
  }
}
async function loadBookReviews(book) {
  const id = book.pbId || book.ebId;
  if (!id || typeof ReviewUI === 'undefined') return;
  const section = document.getElementById('book-reviews');
  document.getElementById('book-review-link').href = 'reviews.html?book=' + encodeURIComponent(id) + '#write-review';
  try {
    const reviews = await ReviewUI.fetchReviews(id);
    const list = document.getElementById('book-reviews-list');
    reviews.slice(0, 6).forEach(r => list.append(ReviewUI.card(r, { showBook: false })));
    document.getElementById('book-reviews-summary').textContent = ReviewUI.summary(reviews);
    document.getElementById('book-reviews-empty').classList.toggle('hidden', reviews.length > 0);
  } catch {
    // Reviews API unavailable: still offer the write-a-review link.
    document.getElementById('book-reviews-empty').classList.remove('hidden');
  }
  section.classList.remove('hidden');
}

init();
</script>
<script src="js/reviews-config.js"></script>
<script src="js/reviews.js"></script>
<script src="js/nav.js"></script>
<script src="js/footer.js"></script>
</body>
</html>
